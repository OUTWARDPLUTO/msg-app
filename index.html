<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MSG" />
    <meta name="theme-color" content="#09090C" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO -->
    <meta name="description" content="MSG — My Smart Gains. AI-powered fitness companion for workouts, nutrition tracking, and progress logging." />
    <meta name="keywords" content="fitness, workout, gym, nutrition, diet, progress tracking, AI" />

    <!-- Open Graph -->
    <meta property="og:title" content="MSG — My Smart Gains" />
    <meta property="og:description" content="AI-powered fitness companion" />
    <meta property="og:type" content="website" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Splash screen color on iOS -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        height: 100%;
        background: #09090C;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      /* Prevent text selection on mobile */
      body { user-select: none; }
      /* Safe area insets for notched phones */
      #root {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>

    <title>MSG — My Smart Gains</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
