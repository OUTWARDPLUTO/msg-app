name: Build iOS App (.ipa)

on:
  workflow_dispatch:
  push:
    branches:
      - native-android-dev
      - main

jobs:
  build:
    name: Build Native iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDhFd7sd_qioRmGoWgOkJweDkvqgMUKznE"
          VITE_GOOGLE_CLIENT_ID: "924373588150-g5hhp1hiu6db6tduir3fr9ekfqkavhir.apps.googleusercontent.com"
          VITE_API_URL: "https://msg-app-7pco.onrender.com"
          VITE_USDA_KEY: "ATtDYsthmzyhhMbNg6b7Wca8DkNVWYyKjDW1m1Xk"
          VITE_WGER_KEY: "dbff5b28a793e01152b0fa45572698e710cb731a"
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Archive (Unsigned)
        run: |
          mkdir -p build
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Building from Xcode Workspace (CocoaPods)..."
            xcodebuild archive \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            echo "Building from Xcode Project (SPM)..."
            xcodebuild archive \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r MSG.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSG-iOS-App
          path: build/MSG.ipa
          retention-days: 14
